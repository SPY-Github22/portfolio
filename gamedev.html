<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Dev — Portfolio</title>
  <meta name="description" content="Game development showcase — interactive experiences and virtual worlds." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cold:    #4a9eff;
      --warm:    #ff8c42;
      --bg:      #07070d;
      --w92:     rgba(255,255,255,0.92);
      --w50:     rgba(255,255,255,0.50);
      --w28:     rgba(255,255,255,0.28);
      --w10:     rgba(255,255,255,0.10);
      --w07:     rgba(255,255,255,0.07);
      --w06:     rgba(255,255,255,0.06);
      --w05:     rgba(255,255,255,0.05);
      --ease-card: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      --ease-entry: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-launch: cubic-bezier(0.76, 0, 0.24, 1);
    }

    html, body {
      background: var(--bg);
      color: var(--w92);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── SECTION SHELL ─────────────────────────────────────────────── */
    #gamedev {
      position: relative;
      min-height: 100vh;
      padding: 80px 60px 60px;
      display: grid;
      grid-template-columns: 280px 1fr;
      grid-template-rows: 1fr auto;
      column-gap: 0;
      row-gap: 0;
      align-items: center;
      cursor: none;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse 80% 40% at 50% -5%, rgba(74,158,255,0.07) 0%, transparent 70%),
        #07070d;
    }

    /* Dot grid — ::before */
    #gamedev::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    /* Grain — ::after */
    #gamedev::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      opacity: 0.022;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 128px 128px;
    }

    /* Vertical divider between columns */
    .gd-divider {
      position: absolute;
      left: calc(60px + 280px);
      top: 80px;
      bottom: 100px;
      width: 1px;
      background: var(--w05);
      z-index: 2;
      transform-origin: top;
      transform: scaleY(0);
      opacity: 0;
    }

    /* ─── FLOATING LIGHT ORB ─────────────────────────────────────────── */
    .gd-orb {
      position: absolute;
      right: 10%;
      top: 50%;
      translate: 0 -50%;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(circle, rgba(74,158,255,0.05) 0%, transparent 70%);
      filter: blur(80px);
      animation: orbFloat 10s ease-in-out infinite alternate;
    }
    @keyframes orbFloat {
      from { transform: translate(-30px,-15px); }
      to   { transform: translate(30px,15px); }
    }

    /* ─── CORNER BRACKETS ───────────────────────────────────────────── */
    .gd-corner {
      position: absolute;
      width: 20px;
      height: 20px;
      z-index: 3;
      opacity: 0;
    }
    .gd-corner--tl { top: 24px; left: 28px; border-top: 1px solid rgba(255,255,255,0.12); border-left: 1px solid rgba(255,255,255,0.12); }
    .gd-corner--tr { top: 24px; right: 28px; border-top: 1px solid rgba(255,255,255,0.12); border-right: 1px solid rgba(255,255,255,0.12); }
    .gd-corner--bl { bottom: 48px; left: 28px; border-bottom: 1px solid rgba(255,255,255,0.12); border-left: 1px solid rgba(255,255,255,0.12); }
    .gd-corner--br { bottom: 48px; right: 28px; border-bottom: 1px solid rgba(255,255,255,0.12); border-right: 1px solid rgba(255,255,255,0.12); }

    /* ─── STATUS BAR ────────────────────────────────────────────────── */
    .gd-statusbar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40px;
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 36px;
      z-index: 3;
      opacity: 0;
    }
    .gd-statusbar span {
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
    }

    /* ─── CURSOR ────────────────────────────────────────────────────── */
    .gd-cursor-dot,
    .gd-cursor-ring {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      border-radius: 50%;
      transform: translate(-50%,-50%);
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .gd-cursor-dot {
      width: 6px;
      height: 6px;
      background: rgba(255,255,255,0.9);
      transition: opacity 0.25s ease, transform 0.3s cubic-bezier(0.34,1.56,0.64,1), width 0.3s cubic-bezier(0.34,1.56,0.64,1), height 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    .gd-cursor-ring {
      width: 32px;
      height: 32px;
      border: 1px solid rgba(255,255,255,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.25s ease, width 0.3s cubic-bezier(0.34,1.56,0.64,1), height 0.3s cubic-bezier(0.34,1.56,0.64,1), border-color 0.3s ease;
    }
    .gd-cursor-ring .gd-cursor-plus {
      position: absolute;
      font-size: 0.5rem;
      color: rgba(74,158,255,0.7);
      opacity: 0;
      transition: opacity 0.2s ease;
      line-height: 1;
      pointer-events: none;
      font-family: 'DM Sans', sans-serif;
    }

    /* cursor states */
    #gamedev.cursor-hovering .gd-cursor-dot {
      opacity: 0;
      transform: translate(-50%,-50%) scale(0);
    }
    #gamedev.cursor-hovering .gd-cursor-ring {
      width: 52px;
      height: 52px;
      border-color: rgba(74,158,255,0.85);
    }
    #gamedev.cursor-hovering .gd-cursor-ring .gd-cursor-plus {
      opacity: 1;
    }
    #gamedev.cursor-clicking .gd-cursor-ring {
      width: 72px;
      height: 72px;
      border-color: rgba(74,158,255,1);
    }

    /* ─── LEFT COLUMN: HEADER ───────────────────────────────────────── */
    .gd-header {
      grid-column: 1;
      grid-row: 1;
      position: relative;
      z-index: 2;
      padding-right: 40px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .gd-label {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--warm);
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      margin-bottom: 14px;
      opacity: 0;
      transform: translateX(-12px);
    }
    .gd-label .blink {
      animation: blink 1.1s step-end infinite;
      color: var(--cold);
      margin-bottom: -2px;
      display: inline-block;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    .gd-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(4.5rem, 9vw, 10rem);
      line-height: 0.9;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 20px;
    }
    .gd-title-game {
      display: block;
      opacity: 0;
      transform: translateY(35px);
    }
    .gd-title-dev {
      display: block;
      opacity: 0;
      transform: translateY(35px);
    }
    .accent-letter {
      background: linear-gradient(135deg, #4a9eff 0%, #ffffff 55%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .gd-subtitle {
      font-size: 0.85rem;
      font-weight: 300;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.05em;
      line-height: 1.65;
      opacity: 0;
      max-width: 220px;
    }

    /* ─── SOCIAL BUTTONS ────────────────────────────────────────────── */
    .gd-socials {
      margin-top: 40px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      opacity: 0;
      transform: translateY(20px);
    }
    .gd-social-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      border-radius: 4px;
      background: #000000;
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 500;
      border: 1px solid rgba(255,255,255,0.15);
      cursor: none;
      transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .gd-social-itch:hover {
      background: #fa5c5c;
      color: #ffffff;
      border-color: #fa5c5c;
      box-shadow: 0 0 15px rgba(250,92,92,0.4);
    }
    .gd-social-github:hover {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
      box-shadow: 0 0 15px rgba(255,255,255,0.4);
    }
    .gd-social-linkedin:hover {
      background: #0077b5;
      color: #ffffff;
      border-color: #0077b5;
      box-shadow: 0 0 15px rgba(0,119,181,0.4);
    }

    /* ─── RIGHT COLUMN: CARDS AREA ──────────────────────────────────── */
    .gd-right {
      grid-column: 2;
      grid-row: 1;
      position: relative;
      z-index: 2;
      padding-left: 48px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: flex-start;
    }

    /* ─── CARDS ROW ─────────────────────────────────────────────────── */
    .gd-cards {
      display: flex;
      flex-flow: row wrap;
      gap: 14px;
      align-items: stretch;
      padding-bottom: 4px;
      max-width: 950px;
    }

    /* ─── CARD ──────────────────────────────────────────────────────── */
    .gd-card {
      position: relative;
      flex: 0 0 240px;
      height: 360px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.07);
      overflow: hidden;
      cursor: none;
      transition:
        flex-basis 400ms var(--ease-card),
        box-shadow  400ms var(--ease-card);
      box-shadow: inset 0 0 50px rgba(0,0,0,0.45), 0 20px 60px rgba(0,0,0,0.4);
      opacity: 0;
      transform: translateY(55px) scaleY(0.9);
      animation: cardBreathe 7s ease-in-out infinite;
    }
    .gd-card:nth-child(2) { animation-delay: -1.75s; }
    .gd-card:nth-child(3) { animation-delay: -3.5s; }
    .gd-card:nth-child(4) { animation-delay: -5.25s; }

    @keyframes cardBreathe {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-5px); }
    }
    .gd-card.hovered,
    .gd-card.expanded {
      animation: none;
    }

    .gd-card.hovered {
      flex: 0 0 420px;
      box-shadow:
        inset 0 0 50px rgba(0,0,0,0.45),
        0 0 0 1px rgba(74,158,255,0.3),
        0 30px 80px rgba(0,0,0,0.5);
    }

    /* Cover art */
    .gd-card-art {
      position: absolute;
      inset: 0;
      background-size: 110% 110%;
      background-position: 50% 50%;
      border-radius: 10px;
      transition: background-position 0.5s ease;
    }

    /* Center scrim */
    .gd-card-scrim {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 240px;
      background: radial-gradient(circle at center, rgba(0,0,0,0.5) 0%, transparent 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .gd-card-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.4rem;
      letter-spacing: 0.05em;
      color: #ffffff;
      line-height: 0.95;
      text-align: center;
      text-shadow: 0 4px 25px rgba(0,0,0,1);
    }

    /* Genre tag */
    .gd-card-genre {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 3;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.95rem;
      letter-spacing: 0.15em;
      color: rgba(255,255,255,1);
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 4px;
      padding: 5px 12px;
    }

    /* Reveal panel — the extra 180px on hover */
    .gd-card-reveal {
      position: absolute;
      top: 0;
      right: 0;
      width: 180px;
      height: 100%;
      z-index: 4;
      border-left: 1px solid rgba(74,158,255,0.4);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px 14px 18px 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 280ms var(--ease-card) 0ms;
      background: rgba(7,7,13,0.25);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      overflow: hidden;
    }
    .gd-card.hovered .gd-card-reveal {
      opacity: 1;
      pointer-events: all;
      transition-delay: 320ms;
    }

    .gd-card-reveal-top {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .gd-card-tagline {
      font-size: 0.95rem;
      font-weight: 300;
      color: rgba(255,255,255,0.75);
      line-height: 1.5;
    }

    .gd-card-meta {
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.38);
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
    }

    /* Spine watermark — vertical title */
    .gd-card-spine {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%) rotate(180deg);
      writing-mode: vertical-rl;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.12);
      pointer-events: none;
      white-space: nowrap;
    }

    /* LAUNCH button */
    .gd-launch-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(74,158,255,0.9);
      background: transparent;
      border: 1px solid rgba(74,158,255,0.45);
      border-radius: 3px;
      padding: 8px 16px;
      cursor: none;
      transition: color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      align-self: flex-start;
    }
    .gd-launch-btn:hover {
      color: rgba(74,158,255,1);
      border-color: rgba(74,158,255,1);
      box-shadow: 0 0 14px rgba(74,158,255,0.25);
    }

    /* ─── CARD INDICATOR DOTS ───────────────────────────────────────── */
    .gd-indicators {
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
    }
    .gd-indicator {
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      width: 4px;
      height: 4px;
      transition: width 300ms var(--ease-card), height 300ms var(--ease-card), border-radius 300ms var(--ease-card), background 300ms ease;
    }
    .gd-indicator.active {
      width: 14px;
      height: 2px;
      border-radius: 2px;
      background: var(--cold);
    }

    /* ─── FLASH ─────────────────────────────────────────────────────── */
    .gd-flash {
      position: fixed;
      inset: 0;
      background: #ffffff;
      z-index: 8000;
      pointer-events: none;
      opacity: 0;
    }

    /* ─── FULL-SCREEN OVERLAY ───────────────────────────────────────── */
    .gd-overlay {
      position: fixed;
      inset: 0;
      z-index: 8001;
      clip-path: inset(50% 50% 50% 50% round 10px);
      opacity: 1;
      pointer-events: none;
      display: grid;
      grid-template-columns: 55% 45%;
    }
    .gd-overlay.active {
      pointer-events: all;
    }

    /* ─── OVERLAY LEFT COLUMN ───────────────────────────────────────── */
    .gd-overlay-left {
      position: relative;
      z-index: 2;
      padding: clamp(36px,6vw,72px) clamp(32px,5vw,68px);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 0;
      background: rgba(7,7,13,0.92);
    }

    .gd-overlay-genre {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      color: rgba(255,255,255,0.4);
      margin-bottom: 10px;
      opacity: 0;
      transform: translateY(20px);
    }

    .gd-overlay-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3.8rem,7vw,8rem);
      line-height: 0.88;
      letter-spacing: 0.01em;
      color: #ffffff;
      margin-bottom: 16px;
      opacity: 0;
      transform: translateY(20px);
    }

    .gd-overlay-tagline {
      font-size: 1.05rem;
      font-weight: 300;
      color: rgba(255,255,255,0.6);
      margin-bottom: 20px;
      opacity: 0;
      transform: translateY(20px);
    }

    .gd-overlay-rule {
      width: 100%;
      height: 1px;
      background: rgba(255,255,255,0.08);
      margin-bottom: 20px;
      opacity: 0;
      transform: translateY(20px);
    }

    .gd-overlay-description {
      font-size: 0.9rem;
      font-weight: 300;
      color: rgba(255,255,255,0.7);
      line-height: 1.7;
      max-width: 360px;
      margin-bottom: 18px;
      opacity: 0;
      transform: translateY(20px);
    }

    .gd-overlay-meta {
      font-size: 0.65rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.28);
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      margin-bottom: 28px;
      opacity: 0;
      transform: translateY(20px);
    }

    .gd-overlay-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      opacity: 0;
      transform: translateY(20px);
    }

    .gd-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 12px 24px;
      border-radius: 4px;
      cursor: none;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .gd-btn-primary {
      background: rgba(74,158,255,0.15);
      border: 1px solid rgba(74,158,255,0.6);
      color: var(--cold);
    }
    .gd-btn-primary:hover {
      background: rgba(74,158,255,0.28);
      border-color: rgba(74,158,255,0.9);
      box-shadow: 0 0 20px rgba(74,158,255,0.2);
    }
    .gd-btn-secondary {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.5);
    }
    .gd-btn-secondary:hover {
      border-color: rgba(255,255,255,0.35);
      color: rgba(255,255,255,0.85);
    }

    /* ─── OVERLAY RIGHT COLUMN — ART PANEL ──────────────────────────── */
    .gd-overlay-right {
      position: relative;
      z-index: 1;
      overflow: hidden;
      border-left: 1px solid rgba(74,158,255,0.2);
      opacity: 0;
    }
    .gd-overlay-right-art {
      position: absolute;
      inset: 0;
      background-size: 140% 140%;
      background-position: 40% 40%;
      animation: artShift 14s ease-in-out infinite alternate;
    }
    @keyframes artShift {
      from { background-position: 40% 40%; }
      to   { background-position: 60% 60%; }
    }
    /* Dot grid on art panel */
    .gd-overlay-right-art::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
      z-index: 1;
    }
    /* Specular highlight */
    .gd-overlay-right-art::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 60% 50% at 65% 30%, rgba(255,255,255,0.1) 0%, transparent 60%);
      z-index: 2;
      pointer-events: none;
    }
    /* Left fade */
    .gd-overlay-right::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 3;
      background: linear-gradient(90deg, rgba(7,7,13,0.75) 0%, rgba(7,7,13,0.15) 40%, transparent 100%);
      pointer-events: none;
    }

    /* ─── CLOSE BUTTON ──────────────────────────────────────────────── */
    .gd-close {
      position: fixed;
      top: clamp(24px,4vw,42px);
      right: clamp(24px,4vw,42px);
      z-index: 8010;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      color: rgba(255,255,255,0.5);
      cursor: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      gap: 3px;
      opacity: 0;
      transition: border-color 0.2s ease, color 0.2s ease;
    }
    .gd-close:hover {
      border-color: rgba(255,255,255,0.3);
      color: rgba(255,255,255,0.85);
    }
    .gd-close-x {
      font-size: 1.4rem;
      font-weight: 300;
      font-family: 'DM Sans', sans-serif;
      line-height: 1;
      display: block;
      transition: transform 0.25s var(--ease-card);
    }
    .gd-close:hover .gd-close-x {
      transform: rotate(45deg);
    }
    .gd-close-esc {
      font-size: 0.5rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.5;
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
    }

    /* ─── SECTION BLUR (behind overlay) ────────────────────────────── */
    #gamedev.blurred {
      filter: blur(6px) brightness(0.4);
      transition: filter 0.4s ease;
    }
    #gamedev.unblurred {
      filter: blur(0) brightness(1);
      transition: filter 0.4s ease;
    }

    /* ─── MOBILE ────────────────────────────────────────────────────── */
    @media (max-width: 768px) {
      #gamedev {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
        padding: 60px 24px 50px;
      }
      .gd-header { padding-right: 0; margin-bottom: 36px; }
      .gd-right { padding-left: 0; }
      .gd-divider { display: none; }
      .gd-overlay { grid-template-columns: 1fr; }
      .gd-overlay-right { display: none; }
      .gd-card { scroll-snap-align: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0ms !important;
        transition-duration: 0ms !important;
      }
    }
  </style>
</head>
<body>

<!-- Cursor elements (outside section so they stay fixed correctly) -->
<div class="gd-cursor-dot" id="gd-cursor-dot" aria-hidden="true"></div>
<div class="gd-cursor-ring" id="gd-cursor-ring" aria-hidden="true">
  <span class="gd-cursor-plus">+</span>
</div>

<section id="gamedev" role="region" aria-label="Game development projects">

  <!-- Floating light orb -->
  <div class="gd-orb" aria-hidden="true"></div>

  <!-- Corner brackets -->
  <div class="gd-corner gd-corner--tl" aria-hidden="true"></div>
  <div class="gd-corner gd-corner--tr" aria-hidden="true"></div>
  <div class="gd-corner gd-corner--bl" aria-hidden="true"></div>
  <div class="gd-corner gd-corner--br" aria-hidden="true"></div>

  <!-- Column divider -->
  <div class="gd-divider" id="gd-divider" aria-hidden="true"></div>

  <!-- LEFT: Header -->
  <header class="gd-header">
    <span class="gd-label">// 003<span class="blink">_</span></span>
    <h1 class="gd-title">
      <span class="gd-title-game"><span class="accent-letter">G</span>AME</span>
      <span class="gd-title-dev">DEV</span>
    </h1>
    <p class="gd-subtitle">Interactive experiences &amp; virtual worlds</p>
    
    <div class="gd-socials" id="gd-socials">
      <a href="https://sudpy-dev.itch.io/" target="_blank" class="gd-social-btn gd-social-itch">Itch.io</a>
      <a href="https://github.com/SPY-Github22" target="_blank" class="gd-social-btn gd-social-github">GitHub</a>
      <a href="https://www.linkedin.com/in/sudarshan-pai-y/" target="_blank" class="gd-social-btn gd-social-linkedin">LinkedIn</a>
    </div>
  </header>

  <!-- RIGHT: Cards + Indicators -->
  <div class="gd-right">
    <div class="gd-cards" id="gd-cards" role="list"></div>
    <div class="gd-indicators" id="gd-indicators" aria-hidden="true"></div>
  </div>

  <!-- Status bar -->
  <div class="gd-statusbar" id="gd-statusbar" aria-hidden="true">
    <span>Hover to expand &nbsp;·&nbsp; Click to launch</span>
    <span>4 Projects &nbsp;·&nbsp; 3 Shipped &nbsp;·&nbsp; 1 WIP &nbsp;·&nbsp; 0 Demo</span>
  </div>

  <!-- Flash -->
  <div class="gd-flash" id="gd-flash" aria-hidden="true"></div>

</section>

<!-- Full-screen overlay (outside section so blur works correctly) -->
<div class="gd-overlay" id="gd-overlay" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Project detail">
  <div class="gd-overlay-left" id="gd-overlay-left">
    <div class="gd-overlay-genre"  id="gd-ov-genre"></div>
    <h2 class="gd-overlay-title"   id="gd-ov-title"></h2>
    <p  class="gd-overlay-tagline" id="gd-ov-tagline"></p>
    <div class="gd-overlay-rule"   id="gd-ov-rule"></div>
    <p  class="gd-overlay-description" id="gd-ov-desc"></p>
    <div class="gd-overlay-meta"   id="gd-ov-meta"></div>
    <div class="gd-overlay-actions" id="gd-ov-actions">
      <button class="gd-btn gd-btn-primary"   id="gd-btn-play">▶&nbsp; Play Demo</button>
      <button class="gd-btn gd-btn-secondary" id="gd-btn-source">⌥&nbsp; Source</button>
    </div>
  </div>
  <div class="gd-overlay-right" id="gd-overlay-right">
    <div class="gd-overlay-right-art" id="gd-ov-art"></div>
  </div>
</div>

<!-- Close button (fixed, outside overlay div for z-index clarity) -->
<button class="gd-close" id="gd-close" aria-label="Close project — press Escape">
  <span class="gd-close-x">×</span>
  <span class="gd-close-esc">ESC</span>
</button>

<script>
(function () {
  'use strict';

  /* ── PROJECT DATA ─────────────────────────────────────────────────── */
  const projects = [
    {
      id: 0,
      title: "ALIEN OUTPOST",
      genre: "ADVENTURE",
      tagline: "Fight for Mars in an alien invasion scenario.",
      engine: "Unity", year: "2023", role: "Solo Dev", status: "SHIPPED",
      description: "An action-adventure game set in an alien invasion scenario. Aliens have invaded Earth, and you must fight for Mars.",
      css: `
        radial-gradient(ellipse 40% 30% at 70% 25%, rgba(255,255,255,0.07) 0%, transparent 60%),
        radial-gradient(ellipse at 30% 65%, #c86020 0%, transparent 55%),
        radial-gradient(ellipse at 75% 20%, rgba(255,140,66,0.2) 0%, transparent 45%),
        linear-gradient(160deg, #5c3010 0%, #2a1a0a 100%)
      `,
      demoLink: "https://sudpy-dev.itch.io/alien-outpost",
      sourceLink: null
    },
    {
      id: 1,
      title: "YEAR 3000",
      genre: "PLATFORMER",
      tagline: "A platformer set in the far future.",
      engine: "Unity", year: "2023", role: "Solo Dev", status: "SHIPPED",
      description: "Face challenges and retrieve the lost object in a futuristic world. Navigate difficult terrain to uncover the truth.",
      css: `
        radial-gradient(ellipse 40% 30% at 70% 25%, rgba(255,255,255,0.07) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 80%, #0a4fa8 0%, transparent 55%),
        radial-gradient(ellipse at 75% 25%, rgba(0,212,255,0.18) 0%, transparent 48%),
        linear-gradient(160deg, #1a3a6b 0%, #0d1f3c 100%)
      `,
      demoLink: "https://sudpy-dev.itch.io/three-thousand-years",
      sourceLink: null
    },
    {
      id: 2,
      title: "HEALTH++",
      genre: "ACTION",
      tagline: "Defeat enemies before time runs out.",
      engine: "Unity", year: "2024", role: "Solo Dev", status: "SHIPPED",
      description: "A fast-paced clicker game where you battle enemies to reach 100 health and win. Available on Browser and Android.",
      css: `
        radial-gradient(ellipse 40% 30% at 70% 25%, rgba(255,255,255,0.07) 0%, transparent 60%),
        radial-gradient(ellipse at 60% 70%, #2d7a3a 0%, transparent 55%),
        radial-gradient(ellipse at 20% 20%, rgba(57,255,110,0.18) 0%, transparent 50%),
        linear-gradient(170deg, #1a4a20 0%, #0a2010 100%)
      `,
      demoLink: "https://sudpy-dev.itch.io/health-plus-clicker-game",
      sourceLink: null
    },
    {
      id: 3,
      title: "THEY ARE COMING",
      genre: "SURVIVAL",
      tagline: "Unreal Engine 5 survival horror action.",
      engine: "Unreal 5", year: "2025", role: "Solo Dev", status: "WIP",
      description: "A survival game built in Unreal Engine 5. Face the incoming horde and fight to survive.",
      css: `
        radial-gradient(ellipse 40% 30% at 70% 25%, rgba(255,255,255,0.07) 0%, transparent 60%),
        radial-gradient(ellipse at 40% 55%, #7c3fcf 0%, transparent 58%),
        radial-gradient(ellipse at 80% 15%, rgba(176,96,255,0.18) 0%, transparent 48%),
        linear-gradient(150deg, #3d1a6b 0%, #1a0a2e 100%)
      `,
      demoLink: null,
      sourceLink: "https://github.com/SPY-Github22/UE5-Game---They-are-coming"
    }
  ];

  /* ── DOM REFS ──────────────────────────────────────────────────────── */
  const section      = document.getElementById('gamedev');
  const cardsEl      = document.getElementById('gd-cards');
  const indicatorsEl = document.getElementById('gd-indicators');
  const flash        = document.getElementById('gd-flash');
  const overlay      = document.getElementById('gd-overlay');
  const ovLeft       = document.getElementById('gd-overlay-left');
  const ovRight      = document.getElementById('gd-overlay-right');
  const ovArt        = document.getElementById('gd-ov-art');
  const ovGenre      = document.getElementById('gd-ov-genre');
  const ovTitle      = document.getElementById('gd-ov-title');
  const ovTagline    = document.getElementById('gd-ov-tagline');
  const ovRule       = document.getElementById('gd-ov-rule');
  const ovDesc       = document.getElementById('gd-ov-desc');
  const ovMeta       = document.getElementById('gd-ov-meta');
  const ovActions    = document.getElementById('gd-ov-actions');
  const closeBtn     = document.getElementById('gd-close');
  const cursorDot    = document.getElementById('gd-cursor-dot');
  const cursorRing   = document.getElementById('gd-cursor-ring');
  const divider      = document.getElementById('gd-divider');
  const statusbar    = document.getElementById('gd-statusbar');
  const corners      = document.querySelectorAll('.gd-corner');
  const btnPlay      = document.getElementById('gd-btn-play');
  const btnSource    = document.getElementById('gd-btn-source');

  let overlayOpen  = false;
  let hoveredCard  = null;
  let activeIdx    = -1;

  /* ── BUILD CARDS ──────────────────────────────────────────────────── */
  projects.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'gd-card';
    card.dataset.id = p.id;
    card.setAttribute('role', 'listitem');
    card.setAttribute('tabindex', '0');
    card.setAttribute('aria-label', `${p.title} — ${p.genre}`);

    card.innerHTML = `
      <div class="gd-card-art" data-id="${p.id}"></div>
      <span class="gd-card-genre">${p.genre}</span>
      <div class="gd-card-scrim">
        <div class="gd-card-title">${p.title.split(' ').join('<br>')}</div>
      </div>
      <div class="gd-card-reveal">
        <div class="gd-card-reveal-top">
          <div class="gd-card-tagline">${p.tagline}</div>
          <div class="gd-card-meta">${p.engine} · ${p.year} · ${p.role}</div>
        </div>
        <span class="gd-card-spine">${p.title}</span>
        <button class="gd-launch-btn" data-launch="${p.id}">LAUNCH →</button>
      </div>
    `;

    card.querySelector('.gd-card-art').style.background = p.css;
    cardsEl.appendChild(card);

    // Indicator dot
    const dot = document.createElement('div');
    dot.className = 'gd-indicator';
    dot.dataset.idx = i;
    indicatorsEl.appendChild(dot);
  });

  const allCards     = cardsEl.querySelectorAll('.gd-card');
  const allDots      = indicatorsEl.querySelectorAll('.gd-indicator');
  const allCardArts  = cardsEl.querySelectorAll('.gd-card-art');

  function setActiveIndicator(idx) {
    allDots.forEach((d, i) => d.classList.toggle('active', i === idx));
  }

  /* ── CARD HOVER ───────────────────────────────────────────────────── */
  allCards.forEach((card, i) => {
    card.addEventListener('mouseenter', () => {
      if (overlayOpen) return;
      if (hoveredCard && hoveredCard !== card) {
        hoveredCard.classList.remove('hovered');
      }
      hoveredCard = card;
      card.classList.add('hovered');
      activeIdx = i;
      setActiveIndicator(i);
      section.classList.add('cursor-hovering');
    });

    card.addEventListener('mouseleave', () => {
      if (overlayOpen) return;
      card.classList.remove('hovered');
      if (hoveredCard === card) hoveredCard = null;
      activeIdx = -1;
      setActiveIndicator(-1);
      section.classList.remove('cursor-hovering');
    });

    card.addEventListener('click', () => {
      launchOverlay(projects[i], card);
    });

    card.querySelector('.gd-launch-btn')?.addEventListener('click', (e) => {
      e.stopPropagation();
      launchOverlay(projects[i], card);
    });

    card.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        launchOverlay(projects[i], card);
      }
    });
  });

  /* ── LAUNCH OVERLAY ───────────────────────────────────────────────── */
  function doFlash(opacity, duration) {
    return new Promise(resolve => {
      flash.style.transition = 'none';
      flash.style.opacity = '0';
      void flash.offsetWidth;
      flash.style.transition = `opacity ${duration * 0.4}ms ease`;
      flash.style.opacity = String(opacity);
      setTimeout(() => {
        flash.style.transition = `opacity ${duration * 0.6}ms ease`;
        flash.style.opacity = '0';
        setTimeout(resolve, duration * 0.6);
      }, duration * 0.4);
    });
  }

  function launchOverlay(p, cardEl) {
    if (overlayOpen) return;
    overlayOpen = true;

    // Populate content
    ovGenre.textContent   = p.genre;
    ovTitle.textContent   = p.title;
    ovTagline.textContent = p.tagline;
    ovDesc.textContent    = p.description;
    ovMeta.textContent    = `${p.engine} · ${p.year} · ${p.role} · ${p.status}`;
    ovArt.style.background = p.css;

    // Set buttons based on links
    if (p.demoLink) {
      btnPlay.style.display = 'inline-flex';
      btnPlay.onclick = () => window.open(p.demoLink, '_blank');
    } else {
      btnPlay.style.display = 'none';
    }

    if (p.sourceLink) {
      btnSource.style.display = 'inline-flex';
      btnSource.onclick = () => window.open(p.sourceLink, '_blank');
    } else {
      btnSource.style.display = 'none';
    }

    // Hide content elements
    const contentEls = [ovGenre, ovTitle, ovTagline, ovRule, ovDesc, ovMeta, ovActions];
    contentEls.forEach(el => {
      el.style.transition = 'none';
      el.style.opacity = '0';
      el.style.transform = 'translateY(20px)';
    });
    ovRight.style.transition = 'none';
    ovRight.style.opacity = '0';
    closeBtn.style.transition = 'none';
    closeBtn.style.opacity = '0';

    // Card bounding box → clip-path start
    const rect = cardEl.getBoundingClientRect();
    const vw = window.innerWidth, vh = window.innerHeight;
    const t = (rect.top    / vh * 100).toFixed(2);
    const b = ((vh - rect.bottom) / vh * 100).toFixed(2);
    const l = (rect.left   / vw * 100).toFixed(2);
    const r = ((vw - rect.right)  / vw * 100).toFixed(2);

    overlay.style.clipPath = `inset(${t}% ${r}% ${b}% ${l}% round 10px)`;
    overlay.setAttribute('aria-hidden', 'false');
    overlay.classList.add('active');

    // Phase 1: flash
    doFlash(0.12, 180).then(() => {
      // Phase 2: expand clip-path
      if (window.gsap) {
        gsap.to(overlay, {
          clipPath: 'inset(0% 0% 0% 0% round 0px)',
          duration: 0.44,
          ease: 'power2.inOut',
          onComplete: revealContent
        });
      } else {
        overlay.style.transition = `clip-path 0.44s var(--ease-launch)`;
        overlay.style.clipPath = 'inset(0% 0% 0% 0% round 0px)';
        setTimeout(revealContent, 460);
      }

      // Blur the section behind
      section.classList.remove('unblurred');
      section.classList.add('blurred');
    });
  }

  function revealContent() {
    const ease = 'cubic-bezier(0.16, 1, 0.3, 1)';
    const contentEls = [ovGenre, ovTitle, ovTagline, ovRule, ovDesc, ovMeta, ovActions];

    contentEls.forEach((el, i) => {
      const delay = 80 + i * 80;
      el.style.transition = `opacity 400ms ${ease} ${delay}ms, transform 400ms ${ease} ${delay}ms`;
      el.style.opacity = '1';
      el.style.transform = 'translateY(0)';
    });

    ovRight.style.transition = 'opacity 500ms ease 100ms';
    ovRight.style.opacity = '1';

    closeBtn.style.transition = 'opacity 300ms ease 500ms';
    closeBtn.style.opacity = '1';

    setTimeout(() => closeBtn.focus(), 600);
  }

  /* ── CLOSE OVERLAY ────────────────────────────────────────────────── */
  function closeOverlay() {
    if (!overlayOpen) return;

    // Fade content
    const contentEls = [ovGenre, ovTitle, ovTagline, ovRule, ovDesc, ovMeta, ovActions, ovRight, closeBtn];
    contentEls.forEach(el => {
      el.style.transition = 'opacity 180ms ease';
      el.style.opacity = '0';
    });

    setTimeout(() => {
      doFlash(0.08, 150);

      // Shrink clip-path
      if (window.gsap) {
        gsap.to(overlay, {
          clipPath: 'inset(40% 45% 40% 45% round 10px)',
          duration: 0.42,
          ease: 'power2.inOut',
          onComplete: finishClose
        });
      } else {
        overlay.style.transition = `clip-path 0.42s var(--ease-launch)`;
        overlay.style.clipPath = 'inset(40% 45% 40% 45% round 10px)';
        setTimeout(finishClose, 440);
      }

      // Un-blur section
      section.classList.remove('blurred');
      section.classList.add('unblurred');
    }, 180);
  }

  function finishClose() {
    overlay.classList.remove('active');
    overlay.setAttribute('aria-hidden', 'true');
    overlay.style.transition = 'none';
    overlay.style.clipPath = 'inset(50% 50% 50% 50% round 10px)';

    if (hoveredCard) {
      hoveredCard.classList.remove('hovered');
      hoveredCard = null;
    }
    setActiveIndicator(-1);
    section.classList.remove('cursor-hovering');
    overlayOpen = false;
  }

  closeBtn.addEventListener('click', closeOverlay);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && overlayOpen) closeOverlay();
  });

  /* ── CUSTOM CURSOR ────────────────────────────────────────────────── */
  let mx = 0, my = 0, rx = 0, ry = 0;
  let cursorActive = false;

  document.addEventListener('mousemove', e => {
    mx = e.clientX;
    my = e.clientY;
  });

  (function animateCursor() {
    rx += (mx - rx) * 0.10;
    ry += (my - ry) * 0.10;
    cursorDot.style.left  = mx + 'px';
    cursorDot.style.top   = my + 'px';
    cursorRing.style.left = rx + 'px';
    cursorRing.style.top  = ry + 'px';
    requestAnimationFrame(animateCursor);
  })();

  section.addEventListener('mouseenter', () => {
    cursorDot.style.opacity  = '1';
    cursorRing.style.opacity = '1';
    cursorActive = true;
  });
  section.addEventListener('mouseleave', () => {
    cursorDot.style.opacity  = '0';
    cursorRing.style.opacity = '0';
    cursorActive = false;
    section.classList.remove('cursor-hovering');
  });

  // Click pulse
  section.addEventListener('mousedown', () => {
    section.classList.add('cursor-clicking');
    setTimeout(() => section.classList.remove('cursor-clicking'), 200);
  });

  // Also show cursor over overlay/close when open
  [overlay, closeBtn].forEach(el => {
    el.addEventListener('mouseenter', () => {
      cursorDot.style.opacity  = '1';
      cursorRing.style.opacity = '1';
    });
  });

  // Expand ring over social links
  const socialLinks = document.querySelectorAll('.gd-social-btn');
  socialLinks.forEach(link => {
    link.addEventListener('mouseenter', () => {
      section.classList.add('cursor-hovering');
    });
    link.addEventListener('mouseleave', () => {
      section.classList.remove('cursor-hovering');
    });
  });

  /* ── AMBIENT PARALLAX ─────────────────────────────────────────────── */
  section.addEventListener('mousemove', e => {
    if (overlayOpen) return;
    const rect = section.getBoundingClientRect();
    const px = (e.clientX - rect.left) / rect.width  - 0.5;
    const py = (e.clientY - rect.top)  / rect.height - 0.5;

    allCardArts.forEach((art, i) => {
      const d = 0.5 + i * 0.18;
      art.style.backgroundPosition = `${50 + px * 10 * d}% ${50 + py * 10 * d}%`;
    });
  });

  /* ── SCROLL REVEAL ────────────────────────────────────────────────── */
  const label    = section.querySelector('.gd-label');
  const titleG   = section.querySelector('.gd-title-game');
  const titleD   = section.querySelector('.gd-title-dev');
  const subtitle = section.querySelector('.gd-subtitle');
  const socials  = document.getElementById('gd-socials');
  const indicators = document.getElementById('gd-indicators');

  const ease = 'cubic-bezier(0.16, 1, 0.3, 1)';

  function triggerEntry() {
    // Phase 1 — header
    label.style.transition = `opacity 300ms ease-out, transform 300ms ease-out`;
    label.style.opacity = '1';
    label.style.transform = 'translateX(0)';

    setTimeout(() => {
      titleG.style.transition = `opacity 500ms ${ease}, transform 500ms ${ease}`;
      titleG.style.opacity = '1';
      titleG.style.transform = 'translateY(0)';
    }, 80);

    setTimeout(() => {
      titleD.style.transition = `opacity 500ms ${ease}, transform 500ms ${ease}`;
      titleD.style.opacity = '1';
      titleD.style.transform = 'translateY(0)';
    }, 180);

    setTimeout(() => {
      subtitle.style.transition = `opacity 500ms ${ease}`;
      subtitle.style.opacity = '1';
    }, 380);

    setTimeout(() => {
      socials.style.transition = `opacity 500ms ${ease}, transform 500ms ${ease}`;
      socials.style.opacity = '1';
      socials.style.transform = 'translateY(0)';
    }, 480);

    // Divider scaleY
    setTimeout(() => {
      divider.style.transition = `transform 600ms ${ease}, opacity 300ms ease`;
      divider.style.opacity = '1';
      divider.style.transform = 'scaleY(1)';
    }, 200);

    // Phase 2 — cards
    allCards.forEach((card, i) => {
      setTimeout(() => {
        card.style.transition = `
          opacity 650ms ${ease},
          transform 650ms ${ease},
          flex-basis 400ms var(--ease-card),
          box-shadow 400ms var(--ease-card)
        `;
        card.style.opacity = '1';
        card.style.transform = 'translateY(0) scaleY(1)';
      }, 480 + i * 90);
    });

    // Phase 3 — UI infrastructure
    setTimeout(() => {
      corners.forEach(c => {
        c.style.transition = 'opacity 600ms ease';
        c.style.opacity = '1';
      });
    }, 800);

    setTimeout(() => {
      statusbar.style.transition = 'opacity 500ms ease';
      statusbar.style.opacity = '1';
    }, 900);

    setTimeout(() => {
      indicators.style.transition = 'opacity 500ms ease';
      indicators.style.opacity = '1';
    }, 1000);
  }

  const observer = new IntersectionObserver(entries => {
    if (entries[0].isIntersecting) {
      triggerEntry();
      observer.disconnect();
    }
  }, { threshold: 0.15 });

  observer.observe(section);

})();
</script>
</body>
</html>
